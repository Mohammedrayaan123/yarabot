<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Dashboard - YaraBot</title>
    <link rel="icon" href="/static/Yaralogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        :root { --brand: #2E3191; --brand-dark: #1E2070; --brand-tint: #F4F5FF; }
        body { background: #F9FAFB; }
        .focus-brand:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
        .btn-brand { background: var(--brand); transition: background 0.15s ease; }
        .btn-brand:hover { background: var(--brand-dark); }
        .status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 11px; font-weight: 600; text-transform: capitalize;
        }
        .status-new { background: #FEF3C7; color: #92400E; }
        .status-under_review { background: #DBEAFE; color: #1E40AF; }
        .status-resolved { background: #D1FAE5; color: #065F46; }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-4xl mx-auto px-4 py-6 sm:py-10">

    <a href="/" class="inline-flex items-center gap-1.5 text-sm text-gray-600 hover:text-gray-800 mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Back to YaraBot
    </a>

    <h1 class="text-xl font-bold text-gray-900 mb-1">Student Complaints</h1>
    <p class="text-sm text-gray-600 mb-6">Private to you - visible to no other role.</p>

    <!-- Summary stats -->
    <div id="stats-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <!-- injected -->
    </div>

    <!-- Filters -->
    <div class="bg-white border border-gray-200 rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-end">
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Status</label>
            <select id="filter-status" onchange="loadComplaints()" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200 bg-white">
                <option value="">All</option>
                <option value="new">New</option>
                <option value="under_review">Under Review</option>
                <option value="resolved">Resolved</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Teacher</label>
            <select id="filter-teacher" onchange="loadComplaints()" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200 bg-white min-w-[140px]">
                <option value="">All</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Class</label>
            <select id="filter-class" onchange="loadComplaints()" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200 bg-white">
                <option value="">All</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">From</label>
            <input type="date" id="filter-date-from" onchange="loadComplaints()" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">To</label>
            <input type="date" id="filter-date-to" onchange="loadComplaints()" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200">
        </div>
        <button onclick="clearFilters()" class="text-sm text-gray-500 hover:text-gray-700 underline pb-2">Clear</button>
    </div>

    <div id="complaints-list" class="space-y-3">
        <p class="text-sm text-gray-500">Loading…</p>
    </div>
</div>

<script>
let filterOptionsLoaded = false;

async function loadComplaints() {
    const params = new URLSearchParams();
    const status = document.getElementById("filter-status").value;
    const teacherId = document.getElementById("filter-teacher").value;
    const cls = document.getElementById("filter-class").value;
    const dateFrom = document.getElementById("filter-date-from").value;
    const dateTo = document.getElementById("filter-date-to").value;
    if (status) params.set("status", status);
    if (teacherId) params.set("teacher_id", teacherId);
    if (cls) params.set("class", cls);
    if (dateFrom) params.set("date_from", dateFrom);
    if (dateTo) params.set("date_to", dateTo);

    try {
        const res = await fetch("/api/vp/complaints?" + params.toString());
        if (res.status === 403) {
            document.body.innerHTML = '<p class="text-center text-sm text-gray-600 mt-20">You don\'t have access to this page.</p>';
            return;
        }
        const data = await res.json();
        renderStats(data.summary);
        if (!filterOptionsLoaded) {
            populateFilterOptions(data.summary.filter_options);
            filterOptionsLoaded = true;
        }
        renderComplaints(data.complaints);
    } catch (e) {
        document.getElementById("complaints-list").innerHTML = '<p class="text-sm text-gray-500">Couldn\'t load complaints right now.</p>';
    }
}

function populateFilterOptions(options) {
    const teacherSelect = document.getElementById("filter-teacher");
    (options.teachers || []).forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.teacher_id;
        opt.textContent = t.name;
        teacherSelect.appendChild(opt);
    });
    const classSelect = document.getElementById("filter-class");
    (options.classes || []).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        classSelect.appendChild(opt);
    });
}

function clearFilters() {
    document.getElementById("filter-status").value = "";
    document.getElementById("filter-teacher").value = "";
    document.getElementById("filter-class").value = "";
    document.getElementById("filter-date-from").value = "";
    document.getElementById("filter-date-to").value = "";
    loadComplaints();
}

function renderStats(summary) {
    const tiles = [
        { label: "New", value: summary.total_new },
        { label: "This Week", value: summary.total_this_week },
        {
            label: "Most Flagged",
            value: summary.most_complained_teacher
                ? `${summary.most_complained_teacher.name} (${summary.most_complained_teacher.count})`
                : "—",
            small: true,
        },
        {
            label: "By Category",
            value: Object.entries(summary.by_category || {}).map(([k, v]) => `${k.replace("_", " ")}: ${v}`).join(", ") || "—",
            small: true,
        },
    ];
    document.getElementById("stats-grid").innerHTML = tiles.map(t => `
        <div class="bg-white border border-gray-200 rounded-2xl p-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">${t.label}</p>
            <p class="${t.small ? 'text-sm' : 'text-2xl'} font-bold text-gray-900">${t.value}</p>
        </div>
    `).join("");
}

function renderComplaints(complaints) {
    const container = document.getElementById("complaints-list");
    if (!complaints || complaints.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500">No complaints match these filters.</p>';
        return;
    }

    container.innerHTML = complaints.map(c => `
        <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div>
                    <span class="text-sm font-semibold text-gray-900">
                        ${c.anonymous ? "Anonymous" : escapeHtml(c.student_name)}
                    </span>
                    ${c.student_class ? `<span class="text-xs text-gray-500"> · ${escapeHtml(c.student_class)}</span>` : ""}
                    <span class="text-xs text-gray-400"> → </span>
                    <span class="text-sm text-gray-700">${escapeHtml(c.teacher_name)}${c.subject ? " (" + escapeHtml(c.subject) + ")" : ""}</span>
                </div>
                <span class="status-badge status-${c.status}">${c.status.replace("_", " ")}</span>
            </div>
            <p class="text-xs text-gray-500 mb-2">${escapeHtml(c.category.replace("_", " "))} · ${new Date(c.created_at).toLocaleString()}</p>
            <p class="text-sm text-gray-800 mb-3 whitespace-pre-wrap">${escapeHtml(c.complaint_text)}</p>

            <div class="border-t border-gray-100 pt-3 flex flex-wrap gap-2 items-end">
                <div class="flex-1 min-w-[160px]">
                    <label class="block text-xs font-medium text-gray-500 mb-1">Resolution notes (private)</label>
                    <textarea id="notes-${c.complaint_id}" rows="2" class="focus-brand w-full text-sm px-3 py-2 rounded-lg border border-gray-200 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Status</label>
                    <select id="status-${c.complaint_id}" class="focus-brand text-sm px-3 py-2 rounded-lg border border-gray-200 bg-white">
                        <option value="new" ${c.status === "new" ? "selected" : ""}>New</option>
                        <option value="under_review" ${c.status === "under_review" ? "selected" : ""}>Under Review</option>
                        <option value="resolved" ${c.status === "resolved" ? "selected" : ""}>Resolved</option>
                    </select>
                </div>
                <button onclick="saveComplaint(${c.complaint_id})" class="btn-brand text-white text-sm font-semibold py-2 px-4 rounded-lg">
                    Save
                </button>
                <span id="saved-${c.complaint_id}" class="hidden text-xs text-green-600 self-center">Saved ✓</span>
            </div>
        </div>
    `).join("");
}

async function saveComplaint(id) {
    const status = document.getElementById(`status-${id}`).value;
    const notes = document.getElementById(`notes-${id}`).value;
    try {
        const res = await fetch(`/api/vp/complaints/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status, resolution_notes: notes }),
        });
        const data = await res.json();
        if (data.success) {
            const badge = document.getElementById(`saved-${id}`);
            badge.classList.remove("hidden");
            setTimeout(() => badge.classList.add("hidden"), 2000);
            loadComplaints();
        }
    } catch (e) {
        // best-effort
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
}

document.addEventListener("DOMContentLoaded", () => {
    loadComplaints();
    fetch("/api/vp/complaints-seen", { method: "POST" }).catch(() => {});
});
</script>
</body>
</html>
